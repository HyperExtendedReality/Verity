[workspace]
members = [
    "crates/verity-core",
    "crates/verity-render",
    "crates/verity-matrix",
    "crates/verity-editor",
    "crates/verity-runtime",
    "crates/verity-box3d",
    "crates/verity-physics",
    "crates/verity-ocean",
    "crates/verity-lux",
    "crates/verity-slang", "crates/verity-terra",
    "crates/verity-ui",
    "crates/verity-nav",
    "crates/verity-agents",
    "crates/verity-pcg",
    "crates/verity-audio",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

# Dependencies (egui, rayon, ash…) run ~10x slower unoptimized, which made the
# debug editor's UI miss frames. Workspace crates stay at opt-level 0 to debug.
[profile.dev.package."*"]
opt-level = 2
