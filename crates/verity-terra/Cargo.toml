[package]
name = "verity-terra"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Eroded, smooth, editable voxel terrain for the Verity runtime"
publish = false

[dependencies]
fast-surface-nets = "0.2.1"
glam = "0.29"
noise = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
verity-physics = { version = "0.1.0", path = "../verity-physics" }

[dev-dependencies]
verity-core = { path = "../verity-core" }
serde_json = "1"
