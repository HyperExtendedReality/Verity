[package]
name = "verity-lux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Split Radiance Cascades global illumination for the Verity renderer"
publish = false

[dependencies]
verity-core = { path = "../verity-core" }
verity-physics = { path = "../verity-physics" }
verity-render = { path = "../verity-render" }
glam = { version = "0.29", features = ["bytemuck"] }
rayon = "1"
ash = "0.38"
bytemuck = { version = "1.25.2", features = ["derive"] }
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }

[build-dependencies]
verity-slang = { version = "0.1.0", path = "../verity-slang" }

[dev-dependencies]
verity-terra = { path = "../verity-terra" }
winit = "0.30"
# HDR-FLIP error maps for `examples/flip.rs`.
flip-rs = "0.1.2"
png = "0.18"
