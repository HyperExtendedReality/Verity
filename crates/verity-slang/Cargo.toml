[package]
name = "verity-slang"
version = "0.1.0"
edition = "2024"
description = "Runtime Slang to SPIR-V compilation for Verity"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/shader-slang/slang"
keywords = ["shader", "slang", "spirv", "vulkan"]
categories = ["game-development", "graphics", "rendering"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tempfile = "3"

[lints.rust]
missing_docs = "warn"

