[package]
name = "verity-render"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
glam = "0.29"
egui = "0.36"
egui-ash-renderer = "0.13"
verity-core = { path = "../verity-core" }
verity-strata = { path = "../verity-strata" }
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
gltf = { version = "1.4.1", default-features = false, features = ["KHR_lights_punctual", "allow_empty_texture", "extensions", "utils", "names"] }
ktx2 = "0.5"
ruzstd = "0.8"
basis-universal = "0.3"
rayon = "1"

[build-dependencies]
verity-slang = { path = "../verity-slang" }

[dev-dependencies]
verity-runtime = { path = "../verity-runtime" }
verity-box3d = { path = "../verity-box3d" }
verity-ocean = { path = "../verity-ocean" }
serde_json = "1"
