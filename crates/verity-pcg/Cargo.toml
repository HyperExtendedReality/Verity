[package]
name = "verity-pcg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Procedural content for Verity: cities from road splines, with blocks, buildings, traffic and crowds"
publish = false

[dependencies]
glam = "0.29"
serde = { version = "1", features = ["derive"] }
verity-agents = { path = "../verity-agents" }
verity-nav = { path = "../verity-nav" }

[dev-dependencies]
serde_json = "1"
